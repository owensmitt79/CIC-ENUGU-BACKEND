# ==============================================================================
# Docker Compose Configuration for CIC Enugu 1995 Alumni Association Portal
# Running from the 'server/' directory
# Project: CIC-ENUGU-25-SET
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Primary Backend REST API Service
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cic-enugu-backend
    restart: unless-stopped
    ports:
      - "${PORT:-5050}:5050"
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=5050
      - API_PREFIX=${API_PREFIX:-/api}
      - DATABASE_URL=${DATABASE_URL:-file:./dev.db}
      - JWT_SECRET=${JWT_SECRET:-cic-enugu-1995-super-secret-jwt-key-2026-production}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - COOKIE_SECRET=${COOKIE_SECRET:-cic-enugu-cookie-secret-key-1995}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080,http://127.0.0.1:8080,http://localhost:5050}
      - ADMIN_NAME=${ADMIN_NAME:-Secretariat SuperAdmin}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@cicalumni1995.org}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-cicEnuguAdmin1995!}
      - ADMIN_PIN=${ADMIN_PIN:-1995}
      - PAYSTACK_SECRET_KEY=${PAYSTACK_SECRET_KEY:-}
      - PAYSTACK_PUBLIC_KEY=${PAYSTACK_PUBLIC_KEY:-}
      - PAYSTACK_BASE_URL=${PAYSTACK_BASE_URL:-https://api.paystack.co}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-}
    volumes:
      # Persist SQLite database and schema across container lifecycles
      - sqlite_data:/app/prisma
      # Persist alumni profile photos and receipt uploads to the host directory
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5050/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ----------------------------------------------------------------------------
  # 2. Optional Production PostgreSQL Database Service
  #    Activate with: docker compose --profile postgres up -d
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: cic-enugu-postgres
    restart: unless-stopped
    profiles:
      - postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cic_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cic_secure_pass_1995}
      POSTGRES_DB: ${POSTGRES_DB:-cic_alumni}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cic_user} -d ${POSTGRES_DB:-cic_alumni}"]
      interval: 10s
      timeout: 5s
      retries: 5

# ------------------------------------------------------------------------------
# Persistent Volume Declarations
# ------------------------------------------------------------------------------
volumes:
  sqlite_data:
    driver: local
  postgres_data:
    driver: local
